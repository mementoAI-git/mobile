name: Mobile — Build & Submit TestFlight

# Manual only (Actions → Run workflow). Builds the iOS `testflight` EAS profile,
# which talks to the staging API, and submits it to App Store Connect /
# TestFlight. It used to run on every push to main, which put staging builds
# next to production builds under the App Store version, where one could be
# picked for review by mistake. Store builds come from the production workflow.
#
# Required GitHub secrets:
#   EXPO_TOKEN          — Expo account token (eas build + eas submit auth)
#   SENTRY_AUTH_TOKEN   — Sentry source-map upload (passed as EAS env var)
#
# All Apple credentials (ASC API key .p8, Key ID, Issuer ID) and the iOS
# provisioning profile / distribution certificate are stored in the EAS
# credential vault. Set them up once with:
#   eas credentials --platform ios

on:
  workflow_dispatch:

jobs:
  build-testflight:
    name: iOS TestFlight build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # expo-github-action installs the EAS CLI and authenticates with EXPO_TOKEN.
      - name: Set up Expo / EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # --auto-submit: after the cloud build completes, EAS CLI immediately
      # submits the artifact to App Store Connect using the credentials stored
      # in the EAS vault. No separate `eas submit` step needed.
      #
      # SENTRY_AUTH_TOKEN is forwarded so the @sentry/react-native/expo plugin
      # can upload source maps during the managed build on Expo's infra.
      - name: Build + submit to TestFlight
        run: |
          eas build \
            --platform ios \
            --profile testflight \
            --non-interactive \
            --auto-submit
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
